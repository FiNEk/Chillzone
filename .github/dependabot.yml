version: 2
updates:
  # Версии actions в .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Conventional Commits, как в AGENTS.md («Коммиты»): «ci: bump ...».
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
